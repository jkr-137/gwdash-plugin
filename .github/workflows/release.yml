name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch "^\d+\.\d+\.\d+") {
            throw "Tag $tag does not look like vMAJOR.MINOR.PATCH"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $version"

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "2b65c20fc66eda893aa15a15a453c3cf09500b19"

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            "-DGWDASH_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin/RelWithDebInfo/GWDash.dll dist/
          Copy-Item bin/RelWithDebInfo/GWDash.core.dll dist/
          Get-FileHash dist/*.dll -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GWDash ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/GWDash.dll
            dist/GWDash.core.dll
            dist/SHA256SUMS
          body: |
            In-game price overlay for [GWDash](https://gwdash.com): Ecto, Armbrace and Black Dye.

            ## Install / update

            ```powershell
            irm https://gwdash.com/install.ps1 | iex
            ```

            Or drop `GWDash.dll` into `%USERPROFILE%\Documents\GWToolboxpp\<COMPUTERNAME>\plugins\` and `GWDash.core.dll` into a `GWDash\` subfolder, then enable the plugin under Settings → Plugins.

            Built against GWToolbox++ `8.32_Release`.
