name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch "^\d+\.\d+\.\d+") {
            throw "Tag $tag does not look like vMAJOR.MINOR.PATCH"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $version"

      - name: Build Windows x86
        uses: ./.github/actions/build-windows-x86
        with:
          version: ${{ steps.version.outputs.version }}
          run_tests: "true"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sign update manifest
        shell: pwsh
        env:
          GWDASH_UPDATE_ED25519_SK: ${{ secrets.GWDASH_UPDATE_ED25519_SK }}
        run: |
          python -m pip install --quiet cryptography
          python scripts/sign-manifest.py --dist dist --version ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GWDash ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/GWDash.dll
            dist/GWDash.core.dll
            dist/GWDash.pdb
            dist/GWDash.core.pdb
            dist/SHA256SUMS
            dist/manifest.json
            dist/manifest.sig
          body: |
            In-game price overlay for [GWDash](https://gwdash.com): Ecto, Armbrace and Black Dye.

            ## Install / update

            ```powershell
            irm https://gwdash.com/install.ps1 | iex
            ```

            Or drop `GWDash.dll` into `%USERPROFILE%\Documents\GWToolboxpp\<COMPUTERNAME>\plugins\` and `GWDash.core.dll` into a `GWDash\` subfolder, then enable the plugin under Settings → Plugins.

            Built against GWToolbox++ `${{ env.GWDASH_TOOLBOX_TAG }}`.
            Release assets include PDBs and an ed25519-signed `manifest.json` for the in-game updater.
