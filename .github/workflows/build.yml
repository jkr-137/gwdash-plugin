name: Build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows x86
        uses: ./.github/actions/build-windows-x86
        with:
          version: "0.0.0-ci"
          run_tests: "true"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so the gate cannot drift with whatever LLVM the runner image ships.
      - name: clang-format check
        shell: pwsh
        run: |
          python -m pip install --quiet clang-format==22.1.8
          $files = Get-ChildItem -Recurse src,loader,compat,tests -Include *.cpp,*.h,*.c |
            Where-Object { $_.FullName -notmatch '\\vendor\\' }
          clang-format --dry-run --Werror @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "clang-format check failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gwdash-plugin-windows-x86
          path: dist/
          if-no-files-found: error
