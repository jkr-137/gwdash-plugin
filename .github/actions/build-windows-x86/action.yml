name: Build Windows x86
description: Configure, build, package, and verify GWDash plugin DLLs (Win32).

inputs:
  version:
    description: Value for -DGWDASH_VERSION
    required: true
  run_tests:
    description: Run gwdash_tests after build
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup MSVC (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: "2b65c20fc66eda893aa15a15a453c3cf09500b19"

    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows-static `
          "-DGWDASH_VERSION=${{ inputs.version }}"

    - name: Build
      shell: pwsh
      run: cmake --build build --config RelWithDebInfo --parallel

    - name: Test
      if: inputs.run_tests == 'true'
      shell: pwsh
      run: |
        $test = "bin/RelWithDebInfo/gwdash_tests.exe"
        if (-not (Test-Path $test)) { $test = "bin/gwdash_tests.exe" }
        & $test
        if ($LASTEXITCODE -ne 0) { throw "gwdash_tests failed" }

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item bin/RelWithDebInfo/GWDash.dll dist/
        Copy-Item bin/RelWithDebInfo/GWDash.core.dll dist/
        if (Test-Path bin/RelWithDebInfo/GWDash.pdb) { Copy-Item bin/RelWithDebInfo/GWDash.pdb dist/ }
        if (Test-Path bin/RelWithDebInfo/GWDash.core.pdb) { Copy-Item bin/RelWithDebInfo/GWDash.core.pdb dist/ }
        Get-FileHash dist/*.dll -Algorithm SHA256 |
          ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
          Set-Content -Encoding ascii dist/SHA256SUMS
        Get-Content dist/SHA256SUMS

    - name: Read Toolbox tag
      id: toolbox
      shell: pwsh
      run: |
        $tag = "unknown"
        $cache = "build/CMakeCache.txt"
        if (Test-Path $cache) {
          $line = Select-String -Path $cache -Pattern "^GWDASH_TOOLBOX_TAG:STRING=" | Select-Object -First 1
          if ($line) { $tag = ($line.Line -split "=",2)[1] }
        }
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "GWDASH_TOOLBOX_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Toolbox tag: $tag"

    - name: Verify exports
      shell: pwsh
      run: |
        $dumpbin = Join-Path $env:VCToolsInstallDir "bin\Hostx86\x86\dumpbin.exe"
        if (-not (Test-Path $dumpbin)) {
          $dumpbin = (Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x86\\dumpbin\.exe$' } |
            Select-Object -First 1).FullName
        }
        if (-not $dumpbin) { throw "dumpbin.exe not found" }

        foreach ($dll in @("dist/GWDash.dll", "dist/GWDash.core.dll")) {
          $exports = & $dumpbin /exports $dll | Out-String
          if ($exports -notmatch "ToolboxPluginInstance") {
            throw "$dll is missing the ToolboxPluginInstance export"
          }
          Write-Host "$dll exports ToolboxPluginInstance"
        }
